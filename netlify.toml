[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  # `npm run dev:netlify` sobe o Vite + as functions juntos em http://localhost:8888
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[functions]
  node_bundler = "esbuild"

# Assets com hash no nome podem ficar em cache "para sempre"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# SPA com React Router: qualquer rota (/atendimento, /noivas…) devolve o index.html
# e o React decide qual página mostrar. A function /api/instagram tem prioridade.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
