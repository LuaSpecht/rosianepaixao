<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rosiane Paixão | Maquiagem e penteado para noivas</title>
    <meta
      name="description"
      content="Maquiagem e penteado para noivas com elegância, confiança e acolhimento. Sua história, sua essência, sua beleza."
    />
    <meta name="theme-color" content="#F9F4F0" />
    <link rel="canonical" href="https://rosianepaixao.com.br/" />

    <!-- Prévia ao compartilhar o link (WhatsApp, Instagram, Facebook).
         As URLs precisam ser completas: esses apps não montam o endereço sozinhos. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Rosiane Paixão" />
    <meta property="og:url" content="https://rosianepaixao.com.br/" />
    <meta property="og:title" content="Rosiane Paixão | Maquiagem e penteado para noivas" />
    <meta
      property="og:description"
      content="Um cuidado especial para você viver cada instante do seu grande dia."
    />
    <meta property="og:image" content="https://rosianepaixao.com.br/images/home-1.jpeg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1086" />
    <meta property="og:image:height" content="1600" />
    <meta property="og:image:alt" content="Rosiane Paixão, maquiadora e penteadista de noivas" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/images/home-1.jpeg" fetchpriority="high" />
    <script>
      // Marca que o JS está ativo antes da pintura: o CSS só esconde o que vai
      // animar quando há JS para revelar depois.
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Ative o JavaScript para ver o site da Rosiane Paixão.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
