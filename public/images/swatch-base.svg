    <!-- sombra interna (sulco do arraste) -->
    <path fill="#9c624d" opacity=".32" d="M40 196c18-30 54-58 92-86 38-28 80-56 120-74-28 26-64 52-98 80-34 28-62 62-90 86-12-2-20-4-24-6z"/>
    <!-- borda mais grossa onde o produto acumulou -->
    <path fill="#c8907a" opacity=".55" d="M30 170c-4 20 6 44 30 52 8 2 14 0 18-4-20-6-36-22-40-44-2-6-6-8-8-4z"/>
    <!-- brilhos -->
    <path fill="none" stroke="url(#h)" stroke-width="7" stroke-linecap="round" d="M70 186c40-40 100-86 168-130"/>
    <path fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round" d="M92 196c36-34 90-76 150-116"/>
    <path fill="none" stroke="#8f5a45" stroke-opacity=".22" stroke-width="2" stroke-linecap="round" d="M60 164c40-38 96-80 158-118"/>
