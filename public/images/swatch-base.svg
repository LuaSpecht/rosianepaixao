<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="b" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b9806a"/>
      <stop offset=".4" stop-color="#d7a78d"/>
      <stop offset=".7" stop-color="#e4bca4"/>
      <stop offset="1" stop-color="#cc977c"/>
    </linearGradient>
    <linearGradient id="h" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="s" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#6b4a3c" flood-opacity=".2"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <!-- corpo da base: começa espesso (onde o dedo apoiou) e afina no arraste -->
